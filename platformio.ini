; ============================================================================
; Sterownik temperatury pieca CO i bojlera CWU
; Ekran:  GMG12864-06D (ST7565R, 128x64, SPI)
; Czujniki: 2x DS18B20 (te same adresy co w starym sterowniku LCD 20x4)
;
; Dwie wersje z tego samego kodu (piny domyslne w include/config.h):
;   pio run -e sterownik -t upload   ESP32-S3 Zero (Waveshare, 4 MB flash)
;   pio run -e c3 -t upload          ESP32-C3 z 4 MB flash (np. SuperMini)
;
; Sekrety (Wi-Fi, Firebase, hasla) sa w pliku .env - wzor: .env.example.
; Skrypt scripts/load_env.py zamienia .env na naglowek env.h przy kazdej kompilacji.
; ============================================================================

[platformio]
default_envs = sterownik
; Lokalne ustawienia komputera (np. port COM) - plik nie trafia do repozytorium.
; Przyklad: platformio_local.ini.example
extra_configs = platformio_local.ini

; Wspolne ustawienia obu wersji
[common]
platform = espressif32@7.0.1
framework = arduino
board_upload.flash_size = 4MB
; 1.9 MB na program (Firebase + WWW + TLS sa duze) i miejsce na aktualizacje przez Wi-Fi
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
extra_scripts = pre:scripts/load_env.py
lib_deps =
    olikraus/U8g2
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson @ ^7
build_flags =
    ; natywne USB (S3 Zero i C3) - bez tego Serial nie pokazuje nic w monitorze
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; --- ESP32-S3 Zero. Port wykrywany automatycznie (albo platformio_local.ini). ---
[env:sterownik]
extends = common
board = esp32-s3-devkitc-1

; --- ESP32-C3 (4 MB flash). Port wykrywany automatycznie. ---
[env:c3]
extends = common
board = esp32-c3-devkitm-1

; Wgrywanie przez Wi-Fi z PlatformIO (wymaga hasla OTA w .env albo na stronie /config):
;   pio run -e ota -t upload      (S3)
;   pio run -e c3-ota -t upload   (C3)
; Haslo OTA dokleja scripts/load_env.py z pliku .env.
; Bez PlatformIO: strona http://<IP>/config -> Aktualizacja oprogramowania.
[env:ota]
extends = env:sterownik
upload_protocol = espota
upload_port = sterownik-co.local

[env:c3-ota]
extends = env:c3
upload_protocol = espota
upload_port = sterownik-co.local
